name: Android CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  build:
    name: Build & Deploy to Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-scan-publish: false
          cache-read-only: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing from secrets."
            exit 1
          fi

          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          CAPTION="🤖 *Bud Translate Debug Build*

          ✅ *Status:* Build Success
          🌿 *Branch:* \`${GITHUB_REF_NAME}\`
          📝 *Commit:* [${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          💬 *Message:* \`${COMMIT_MSG}\`"

          curl -f -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@"$APK_PATH" \
               -F caption="$CAPTION" \
               -F parse_mode="Markdown" \
               https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
